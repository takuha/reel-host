<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>アグー豚ガチャ｜準備中</title>
<style>
  :root{--bg:#0d0a07;--gold:#d8b46a;--text:#efe6d2;--sub:#a99a7c}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:radial-gradient(ellipse at 50% 30%,#2a1f12 0%,var(--bg) 70%);color:var(--text);
    font-family:"Hiragino Mincho ProN","Yu Mincho",serif;display:flex;align-items:center;justify-content:center;padding:24px 16px}
  .card{max-width:380px;width:100%;text-align:center;border:1px solid rgba(216,180,106,.45);border-radius:18px;
    padding:40px 24px;background:rgba(20,14,8,.7);box-shadow:0 0 40px rgba(216,180,106,.12)}
  .mark{width:58px;height:58px;margin:0 auto 18px;border:1.5px solid var(--gold);border-radius:50%;
    display:flex;align-items:center;justify-content:center;color:var(--gold);font-size:22px;line-height:1.1}
  .en{letter-spacing:.3em;font-size:11px;color:var(--gold);margin-bottom:8px}
  h1{font-size:26px;color:var(--gold);letter-spacing:.08em;margin-bottom:22px}
  .status{display:inline-block;border:1px solid var(--gold);color:var(--gold);padding:6px 22px;border-radius:999px;
    font-size:16px;letter-spacing:.2em;margin-bottom:22px}
  p{font-size:14px;line-height:1.9;color:var(--sub)}
  .foot{margin-top:26px;font-size:12px;color:var(--sub)}
</style>
</head>
<body>
  <div class="card">
    <div class="mark">青<br>柳</div>
    <div class="en">AGU PORK GACHA</div>
    <h1>アグー豚ガチャ</h1>
    <div class="status">ただいま準備中</div>
    <p>もっと楽しくお届けできるよう、<br>ただいま準備を進めています。<br>再開まで、もうしばらくお待ちください。</p>
    <p class="foot">あぐー豚しゃぶしゃぶ 青柳</p>
  </div>
</body>
</html>
